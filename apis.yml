name: Abacus Storage King

description: 'Abacus Storage King (ASX: ASK), which now trades as Storage King Group, is an ASX-listed self-storage owner and operator. Its stapled entities are Abacus Storage Operations Limited and Abacus Storage Property Trust. Under the Storage King brand it runs a network of more than 200 owned and managed self-storage facilities across Australia and New Zealand, renting storage units to households and businesses. It publishes no public developer API, documentation or developer portal; its web presence is the consumer storage site www.storageking.com.au and the investor site investors.storageking.com.au.'

